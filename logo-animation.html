  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .logo-wrapper {
      width: min(480px, 72vw);
    }

    .logo-wrapper svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    #replay {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: #4F6E4E;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      letter-spacing: 0.08em;
      cursor: pointer;
      font-family: sans-serif;
      opacity: 0.7;
    }
    #replay:hover { opacity: 1; }
  </style>

<button id="replay">↺ replay</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const wrapper     = document.querySelector('.logo-wrapper')
  const letras      = gsap.utils.toArray('#frizon-text path')
  const construtora = document.querySelector('#construtora-text')

  // F mark center em SVG ≈ x:212 de 1858 → centra empurrando wrapper ~38% pra direita
  const OFFSET = '38%'

  function play() {
    // Reset
    gsap.set(wrapper,     { x: OFFSET })
    gsap.set(construtora, { autoAlpha: 0, y: 5 })
    gsap.set(letras,      { autoAlpha: 0, x: -28, filter: 'blur(8px)' })
    gsap.set('#f-mark', { scale: 2.8, svgOrigin: '212 395' })

    const tl = gsap.timeline({ delay: 0.4 })

    // F mark encolhe até tamanho natural + desloca pra esquerda simultaneamente
    tl.to('#f-mark', {
      scale: 1,
      svgOrigin: '212 395',
      duration: 1.3,
      ease: 'sine.inOut'
    })

    tl.to(wrapper, {
      x: 0,
      duration: 1.2,
      ease: 'sine.inOut'
    }, '<')

    // Letras emergem suavemente enquanto F termina de encolher
    tl.to(letras, {
      autoAlpha: 1,
      x: 0,
      filter: 'blur(0px)',
      duration: 0.9,
      ease: 'power2.out',
      stagger: { each: 0.11, from: 'start' }
    }, '-=0.55')

    // CONSTRUTORA: fade + leve subida
    tl.to(construtora, {
      autoAlpha: 1,
      y: 0,
      duration: 0.9,
      ease: 'power2.out'
    }, '-=0.3')
  }

  play()
  document.getElementById('replay').addEventListener('click', play)
</script>
